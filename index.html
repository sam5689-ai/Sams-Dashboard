<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sam's Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">Sam's Dashboard</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="overview">
          <span class="nav-icon">&#9673;</span> Overview
        </button>
        <button class="nav-item" data-view="scheduler">
          <span class="nav-icon">&#128197;</span> Meeting Scheduler
        </button>
        <button class="nav-item" data-view="interviews">
          <span class="nav-icon">&#128100;</span> Interview Tracker
        </button>
        <button class="nav-item" data-view="tasks">
          <span class="nav-icon">&#9745;</span> Tasks
        </button>
      </nav>
      <div class="sidebar-footer">
        <button id="googleConnectBtn" class="ghost-btn" title="Connect Google Calendar">&#128279; Connect Google</button>
        <button id="themeToggle" class="ghost-btn" title="Toggle theme">&#9788; Theme</button>
        <button id="exportBtn" class="ghost-btn" title="Export all data">&#8595; Export</button>
        <label class="ghost-btn" title="Import data">
          &#8593; Import
          <input type="file" id="importInput" accept="application/json" hidden />
        </label>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">&#9776;</button>
        <h1 id="viewTitle">Overview</h1>
        <div class="topbar-date" id="topbarDate"></div>
      </header>

      <section class="view active" id="view-overview">
        <div class="stat-grid" id="statGrid"></div>
        <div class="panel-grid">
          <div class="panel">
            <div class="panel-header">
              <h2>Today &amp; Upcoming Meetings</h2>
              <button class="link-btn" data-goto="scheduler">View all &rarr;</button>
            </div>
            <div id="overviewMeetings" class="mini-list"></div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>Active Candidates</h2>
              <button class="link-btn" data-goto="interviews">View all &rarr;</button>
            </div>
            <div id="overviewCandidates" class="mini-list"></div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>Tasks Due Soon</h2>
              <button class="link-btn" data-goto="tasks">View all &rarr;</button>
            </div>
            <div id="overviewTasks" class="mini-list"></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-scheduler">
        <div class="toolbar">
          <div class="filter-group">
            <select id="meetingFilter">
              <option value="upcoming">Upcoming</option>
              <option value="today">Today</option>
              <option value="past">Past</option>
              <option value="all">All</option>
            </select>
            <input type="search" id="meetingSearch" placeholder="Search meetings..." />
          </div>
          <button class="primary-btn" id="addMeetingBtn">+ New Meeting</button>
        </div>
        <div id="meetingList" class="card-list"></div>
      </section>

      <section class="view" id="view-interviews">
        <div class="toolbar">
          <div class="filter-group">
            <select id="candidateStageFilter">
              <option value="all">All Stages</option>
              <option value="Screening">Screening</option>
              <option value="Phone Interview">Phone Interview</option>
              <option value="Technical">Technical</option>
              <option value="Onsite">Onsite</option>
              <option value="Offer">Offer</option>
              <option value="Hired">Hired</option>
              <option value="Rejected">Rejected</option>
            </select>
            <input type="search" id="candidateSearch" placeholder="Search candidates..." />
          </div>
          <div class="filter-group">
            <button class="secondary-btn" id="importCandidatesBtn">&#8593; Import Candidates</button>
            <button class="primary-btn" id="addCandidateBtn">+ New Candidate</button>
          </div>
        </div>
        <div class="pipeline" id="pipelineBoard"></div>
      </section>

      <section class="view" id="view-tasks">
        <div class="toolbar">
          <div class="filter-group">
            <select id="taskStatusFilter">
              <option value="all">All</option>
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
            <select id="taskPriorityFilter">
              <option value="all">All Priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <input type="search" id="taskSearch" placeholder="Search tasks..." />
          </div>
          <button class="primary-btn" id="addTaskBtn">+ New Task</button>
        </div>
        <div id="taskList" class="card-list"></div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/google.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/interviews.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
