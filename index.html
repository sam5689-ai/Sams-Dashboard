<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sam's Dashboard</title>
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">Sam's Dashboard</span>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu"><span data-icon="x"></span></button>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="overview">
          <span class="nav-icon" data-icon="grid"></span> Overview
        </button>
        <button class="nav-item" data-view="contacts">
          <span class="nav-icon" data-icon="user"></span> Contacts
        </button>
        <button class="nav-item" data-view="scheduler">
          <span class="nav-icon" data-icon="calendar"></span> Meeting Scheduler
        </button>
        <button class="nav-item" data-view="interviews">
          <span class="nav-icon" data-icon="users"></span> Interview Tracker
        </button>
        <button class="nav-item" data-view="tasks">
          <span class="nav-icon" data-icon="checkSquare"></span> Tasks
        </button>
        <button class="nav-item" data-view="inbox">
          <span class="nav-icon" data-icon="mail"></span> Inbox
        </button>
        <button class="nav-item" data-view="whatsapp">
          <span class="nav-icon" data-icon="messageCircle"></span> WhatsApp
        </button>
      </nav>
      <div class="sidebar-footer">
        <button id="googleConnectBtn" class="ghost-btn" title="Connect Google Calendar"><span data-icon="link"></span> Connect Google</button>
        <button id="themeToggle" class="ghost-btn" title="Toggle theme"><span data-icon="contrast"></span> Theme</button>
        <button id="exportBtn" class="ghost-btn" title="Export all data"><span data-icon="download"></span> Export</button>
        <label class="ghost-btn" title="Import data">
          <span data-icon="upload"></span> Import
          <input type="file" id="importInput" accept="application/json" hidden />
        </label>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 id="viewTitle">Overview</h1>
        <div class="topbar-date" id="topbarDate"></div>
      </header>

      <section class="view active" id="view-overview">
        <div class="stat-grid" id="statGrid"></div>
        <div class="panel-grid">
          <div class="panel">
            <div class="panel-header">
              <h2>Today &amp; Upcoming Meetings</h2>
              <button class="link-btn" data-goto="scheduler">View all <span data-icon="arrowRight"></span></button>
            </div>
            <div id="overviewMeetings" class="mini-list"></div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>Active Candidates</h2>
              <button class="link-btn" data-goto="interviews">View all <span data-icon="arrowRight"></span></button>
            </div>
            <div id="overviewCandidates" class="mini-list"></div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>Tasks Due Soon</h2>
              <button class="link-btn" data-goto="tasks">View all <span data-icon="arrowRight"></span></button>
            </div>
            <div id="overviewTasks" class="mini-list"></div>
          </div>
        </div>
      </section>

      <section class="view" id="view-contacts">
        <div class="toolbar">
          <div class="filter-group">
            <input type="search" id="contactSearch" placeholder="Search contacts..." />
          </div>
          <button class="primary-btn" id="addContactBtn"><span data-icon="plus"></span> New Contact</button>
        </div>
        <div id="contactsList" class="card-list"></div>
      </section>

      <section class="view" id="view-scheduler">
        <div class="toolbar">
          <div class="filter-group">
            <select id="meetingFilter">
              <option value="upcoming">Upcoming</option>
              <option value="today">Today</option>
              <option value="past">Past</option>
              <option value="all">All</option>
            </select>
            <input type="search" id="meetingSearch" placeholder="Search meetings..." />
          </div>
          <div class="filter-group">
            <button class="secondary-btn" id="syncFromGoogleBtn"><span data-icon="download"></span> Sync from Google</button>
            <button class="primary-btn" id="addMeetingBtn"><span data-icon="plus"></span> New Meeting</button>
          </div>
        </div>
        <div id="meetingList" class="card-list"></div>
      </section>

      <section class="view" id="view-interviews">
        <div class="toolbar">
          <div class="filter-group">
            <select id="candidateStageFilter">
              <option value="all">All Stages</option>
              <option value="Screening">Screening</option>
              <option value="Phone Interview">Phone Interview</option>
              <option value="Technical">Technical</option>
              <option value="Onsite">Onsite</option>
              <option value="Offer">Offer</option>
              <option value="Hired">Hired</option>
              <option value="Rejected">Rejected</option>
            </select>
            <input type="search" id="candidateSearch" placeholder="Search candidates..." />
          </div>
          <div class="filter-group">
            <button class="secondary-btn" id="importCandidatesBtn"><span data-icon="upload"></span> Import Candidates</button>
            <button class="primary-btn" id="addCandidateBtn"><span data-icon="plus"></span> New Candidate</button>
          </div>
        </div>
        <div class="pipeline" id="pipelineBoard"></div>
      </section>

      <section class="view" id="view-tasks">
        <div class="toolbar">
          <div class="filter-group">
            <select id="taskStatusFilter">
              <option value="all">All</option>
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
            <select id="taskPriorityFilter">
              <option value="all">All Priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <input type="search" id="taskSearch" placeholder="Search tasks..." />
          </div>
          <div class="filter-group">
            <button class="secondary-btn" id="syncFromEmailBtn"><span data-icon="download"></span> Sync from Email</button>
            <button class="primary-btn" id="addTaskBtn"><span data-icon="plus"></span> New Task</button>
          </div>
        </div>
        <div id="taskList" class="card-list"></div>
      </section>

      <section class="view" id="view-inbox">
        <div class="toolbar">
          <div class="filter-group">
            <span class="search-input-wrap">
              <span data-icon="search"></span>
              <input type="text" id="inboxSearchInput" placeholder="Search mail (e.g. from:sam invoice)" />
            </span>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="secondary-btn" id="refreshInboxBtn"><span data-icon="download"></span> Refresh</button>
            <button class="primary-btn" id="composeEmailBtn"><span data-icon="edit"></span> Compose</button>
          </div>
        </div>
        <div id="inboxList" class="card-list"></div>
        <div id="inboxLoadMoreWrap" class="load-more-wrap" hidden>
          <button class="secondary-btn" id="inboxLoadMoreBtn">Load more</button>
        </div>
      </section>

      <section class="view" id="view-whatsapp">
        <div class="toolbar">
          <div class="filter-group">
            <span style="color:var(--text-muted);font-size:13px;">Recent messages sent to your WhatsApp Business number.</span>
          </div>
          <button class="secondary-btn" id="refreshWhatsAppBtn"><span data-icon="download"></span> Refresh</button>
        </div>
        <div id="whatsappList" class="card-list"></div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/contacts.js"></script>
  <script src="js/google.js"></script>
  <script src="js/gmail.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/interviews.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/inbox.js"></script>
  <script src="js/whatsapp-inbox.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
